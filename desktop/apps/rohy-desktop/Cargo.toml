[package]
name = "rohy-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
arboard = "3.7.0"
directories = "6.0.0"
gethostname = "1.1.0"
iced = { version = "0.14.0", features = ["tokio", "image"] }
keyring = "4.2.0"
qrcode = "0.14.1"
rohy-core = { version = "0.1.0", path = "../../crates/rohy-core" }
rohy-server = { version = "0.1.0", path = "../../crates/rohy-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem over D-Bus: no GTK system libraries needed.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
