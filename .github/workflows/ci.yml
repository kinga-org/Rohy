name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS runner: the Kotlin interop test needs the Swift server harness.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Mac (Swift tests + coverage)
        run: scripts/check-mac.sh
      - name: Android (Kotlin tests + interop + Kover + build)
        run: scripts/check-android.sh
