name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS runner: the Kotlin interop test needs the Swift server harness.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Mac (Swift tests + coverage)
        run: scripts/check-mac.sh
      - name: Android (Kotlin tests + interop with Swift and Rust servers + Kover + build)
        run: scripts/check-android.sh

  desktop:
    # Rust core and server for the Windows/Linux app.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Desktop (fmt + clippy + tests + coverage)
        shell: bash
        run: scripts/check-desktop.sh
